services:
   postgres:
      image: postgres:17
      restart: unless-stopped
      container_name: hotel-postgres
      environment:
         POSTGRES_USER: username
         POSTGRES_PASSWORD: password
         POSTGRES_DB: hotel
      ports:
         - '5432:5432'
      healthcheck:
         test: ['CMD-SHELL', 'ph_isready -U username -d hotel']
         interval: 10s
         timeout: 5s
         retries: 5

      volumes:
         - ./docker/postgres:/var/lib/postgresql/data
